# NOTES:
# - Currently using Python 3.11 for development
# - Currently, the devices in fullbindings are the ones that work
# - Fix PyQt6/PySide6 xcb plugin error on Linux by installing:
#  sudo apt install libxcb-cursor0

[build-system]
requires = ["setuptools>=61", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[project]
name = "epicpy"
version = "2026.11.17.16"
authors = [
    { name = "Travis L. Seymour, PhD", email = "nogard@ucsc.edu" }
]
description = "Python interface to the EPIC computational cognitive architecture simulation environment."
readme = "ReadMe.md"
requires-python = ">=3.11,<3.15"
license = "GPL-3.0-or-later"
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Natural Language :: English",
    "Topic :: Education",
    "Topic :: Scientific/Engineering",
    ]

dependencies = [
    "loguru>=0.6.0,<0.8",
    "PySide6>=6.8.3",
    "python-dateutil>=2.8.2,<3.0",
    "ulid2>=0.3.0,<1.0",
    "numpy>=1.24,<3.0",
    "scipy>=1.9",
    "pingouin>=0.5.2,<1.0",
    "ascii_frame>=0.0.1,<1.0",
    "pandas>=2.0,<3.0",
    "polars>=1.32.3,<2.0",
    "pyqtdarktheme",
    "pyqtgraph>=0.13.3,<1.0",
    "platformdirs>=3.0",
    "requests>=2.28,<3.0",
    "fastparquet>=2024.11.0",
    "pyarrow>=21.0.0",
    "pywin32; sys_platform == 'win32'",
    "rich>=13.4,<14",
    "networkx>=3.1,<4",
    "graphviz>=0.20.3,<1",
    "epiclibcpp>=0.1.4,<1",
    "munch>=4.0.0,<5",
    "epicpydevicelib>=0.1.0",
    "psutil>=5.9,<7.0",
]

# pip install --extra-index-url https://test.pypi.org/simple/ epiclibcpp

[project.optional-dependencies]
dev = [
    "ruff>=0.13.0",
    "plumbum>=1.8.1",
    "pytest>=7.2.2",
    "qt6-tools==6.4.3.1.3"
]

[project.urls]
"Homepage" = "https://github.com/travisseymour/EPICpy"

[tool.setuptools.packages.find]
exclude = [
    "contrib", "docs", "tests*", "test*", "build", "epicpy.egg-info"
]

[project.scripts]
epicpy-debug = "epicpy.main:main"

[project.gui-scripts]
EPICpy = "epicpy.main:main"
epicpy = "epicpy.main:main"

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.ruff]
line-length = 130
exclude = ["epicpy/uifiles"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
]
ignore = [
    "E402",
    "E731"
]